models:
  - name: stg_postings
    description: >
      One row per posting per scrape day. Scraper error rows are removed;
      a job scraped on many days keeps every row.
    columns:
      - name: job_id
        description: "Posting id from the scraper. Can be NULL, and one job repeats across scrape days."
      - name: company_name
        description: "Name as posted. Some names are job boards, not employers."
        data_tests:
          - not_blank
      - name: job_location
        description: "Location text from the posting. NULL when the posting gives none."
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: pay_unit
        description: "Last word of job_salary: year, hour, month, day or week. NULL when there is no salary."
      - name: pay_unit
        description: "Last word of job_salary: year, hour, month, day or week. NULL when there is no salary."
        data_tests:
          - accepted_values:
              arguments:
                values: ['year', 'hour', 'month', 'day', 'week']        
      - name: job_title
        data_tests:
          - not_blank
      - name: source_platform
        data_tests:
          - not_blank

  - name: stg_skills
    columns:
      - name: job_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_postings')
                field: job_id

unit_tests:
  - name: test_staging_filters
    description: "Error rows and rows without a job_id stay out; the via prefix comes off"
    model: stg_postings
    given:
      - input: source('jobs', 'raw_job_postings')
        rows:
          - {job_id: "a1", job_via: "via LinkedIn", error: true}
          - {job_id: null, job_via: "via Indeed"}
          - {job_id: "b2", job_via: "via LinkedIn"}
          - {job_id: "c3", job_via: "Indeed"}
    expect:
      rows:
        - {job_id: "b2", source_platform: "LinkedIn"}
        - {job_id: "c3", source_platform: "Indeed"}